<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>红果短剧</title>
<style>html,body{height:100%;margin:0;background:#0c0d12;color:#f7f7fb;font:16px -apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.logo{position:relative;width:86px;height:86px;margin:16px}.logo:before{content:"";position:absolute;inset:-12px;border:3px solid #ffffff20;border-top-color:#DB411E;border-radius:50%;animation:spin 1.3s linear infinite}.logo svg{width:100%;height:100%}h1{font-size:21px;font-weight:500;margin:22px 20px 12px}p{color:#a4a5af;margin:0 20px 18px;max-width:440px;line-height:1.6}button{border:0;border-radius:8px;padding:12px 24px;background:#ff693e;color:white;font:inherit;cursor:pointer}button:focus{outline:3px solid white;outline-offset:4px}.failed .logo:before{animation:none;border-color:#f35d7b}button[hidden]{display:none}@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body><main><div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><circle cx="50" cy="50" r="50" fill="#DB411E" />
  <g transform="translate(5,5) scale(0.9)">
    <circle cx="50" cy="50" r="33" fill="#FFFFFF" />
    <path d="M51 18 C51 11 56 8 63 8 C63 14 58 19 51 18 Z" fill="#FFFFFF" />
    <path d="M43 36 L43 64 L68 50 Z" fill="#DB411E" stroke="#DB411E" stroke-width="4" stroke-linejoin="round" />
  </g></svg></div><h1 id="message">正在启动红果短剧...</h1><p id="version"></p><button id="retry" hidden>重试</button></main>
<script>(function(){var config=window.HongguoDesktop||{};document.getElementById('version').textContent=config.version||'';var retry=document.getElementById('retry'),message=document.getElementById('message');function poll(){fetch('/desktop/status').then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(s){if(s.ready){location.replace('/index.html');return}retry.hidden=!!s.starting;document.body.classList.toggle('failed',!s.starting);message.textContent=s.error||'正在启动红果短剧...';setTimeout(poll,500)}).catch(function(){message.textContent='启动状态读取失败，请重试。';retry.hidden=false;document.body.classList.add('failed')})}retry.onclick=function(){retry.hidden=true;fetch('/desktop/retry',{method:'POST'}).then(poll).catch(poll)};poll()}());</script></body></html>
