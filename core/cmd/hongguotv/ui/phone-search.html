<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>红果短剧 · 手机找剧</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15151e;color:#f5f5fa;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}main{max-width:440px;margin:32px auto}.brand{color:#d07a8d;font-size:14px;letter-spacing:2px;margin-bottom:28px}h1{font-size:28px;margin:0 0 8px}p{color:#b8bac9;margin:8px 0 24px}.card{background:#20212d;border:1px solid #353644;border-radius:20px;padding:24px}label{display:block;font-size:14px;color:#c4c6d4;margin-bottom:10px}input,button{width:100%;font:inherit;border-radius:12px;padding:15px}input{color:#fff;background:#15151e;border:1px solid #686a7e;font-size:20px;outline:none}input:focus{border-color:#e990a3;box-shadow:0 0 0 2px #e990a333}button{margin-top:18px;border:0;background:#c73555;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.45;cursor:default}#status{font-size:14px;min-height:46px;margin:18px 0 0}#status[data-state=success]{color:#a3d9b2}#status[data-state=error]{color:#ffb0bd}.hint{font-size:13px;line-height:1.9;padding:0 4px;margin-top:22px}button:focus-visible{outline:2px solid white;outline-offset:4px}@media(max-width:360px){body{padding:18px}.card{padding:20px}}
</style></head><body><main><div class="brand" id="brand">红果短剧</div><h1 id="title">手机找剧</h1><p id="copy">用熟悉的输入法，把想看的剧送到电视。</p><form id="form" class="card" autocomplete="off"><label id="label" for="query">剧名 / 关键词</label><input id="query" name="query" type="text" required maxlength="100" placeholder="输入或粘贴剧名" autocomplete="off"><button id="send" type="submit" disabled>发送到电视搜索</button><p id="status" role="status" aria-live="polite">正在连接电视…</p></form><p class="hint" id="hint">收藏此页面，下次无需重新扫码。<br>手机与电视需在同一局域网，电视需打开“找剧”。<br>电视 IP 变化后，请重新扫码。</p></main><script src="mobile.js"></script></body></html>
