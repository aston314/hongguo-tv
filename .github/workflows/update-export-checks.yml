name: Android update export checks

on:
  push:
    paths: ['android/app/src/main/java/rocks/aston/hongguotv/Update*.java', 'android/app/src/main/java/rocks/aston/hongguotv/AppUpdater.java', 'android/app/src/main/java/rocks/aston/hongguotv/MainActivity.java', 'android/app/src/main/AndroidManifest.xml', 'android/app/src/androidTest/**', 'scripts/check_android_update_export.sh', '.github/workflows/update-export-checks.yml']
  pull_request:
    paths: ['android/app/src/main/java/rocks/aston/hongguotv/Update*.java', 'android/app/src/main/java/rocks/aston/hongguotv/AppUpdater.java', 'android/app/src/main/java/rocks/aston/hongguotv/MainActivity.java', 'android/app/src/main/AndroidManifest.xml', 'android/app/src/androidTest/**', 'scripts/check_android_update_export.sh', '.github/workflows/update-export-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [23, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build update tests in GitHub Actions
        run: gradle --no-daemon --max-workers=1 -p android testStandardDebugUnitTest assembleStandardDebug assembleStandardDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify permissions, checked bytes, name collisions and failure cleanup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/check_android_update_export.sh '${{ matrix.api }}'
