name: Android 5 isolated compatibility test

on:
  push:
    branches: [codex/android5-compat-test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android5-compat-test
  cancel-in-progress: false

jobs:
  test-package:
    if: github.ref == 'refs/heads/codex/android5-compat-test'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ANDROID5_TEST_OUTPUT: ${{ runner.temp }}/android5-test
      HONGGUO_CORE_VERSION: 0.2.136-android5-test.1+${{ github.sha }}
      TEST_TAG: android5-compat-0.2.136-test.1
    steps:
      - uses: actions/checkout@v4
      - name: Verify experiment source
        run: |
          test "$GITHUB_REF" = refs/heads/codex/android5-compat-test
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$ANDROID5_TEST_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Core and shared UI regressions
        run: |
          go test ./...
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build API21 native cores
        env:
          ANDROID_API: '21'
          VERSION: ${{ env.HONGGUO_CORE_VERSION }}
        run: bash scripts/build_android_binaries.sh
      - name: Restore existing signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android5-test.keystore"
          chmod 600 "$RUNNER_TEMP/android5-test.keystore"
      - name: Build, test and lint isolated standard APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android5-test.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --max-workers=1 -p android -Pandroid5Compat=true testStandardReleaseUnitTest assembleStandardRelease lintStandardRelease
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk "$ANDROID5_TEST_OUTPUT/hongguo-tv-android5-test.1.apk"
          gradle --no-daemon --max-workers=1 -p android -Pandroid5Compat=true -Pandroid5Arm32Only=true assembleStandardRelease
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk "$ANDROID5_TEST_OUTPUT/hongguo-tv-android5-test.1-arm32.apk"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android5-test.keystore"
      - name: Verify signed APKs
        run: python3 scripts/verify_android5_test_apk.py --directory "$ANDROID5_TEST_OUTPUT" | tee "$ANDROID5_TEST_OUTPUT/apk-verification.json"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 5 API21
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 21
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/smoke_android5_test.py
      - name: Package evidence and checksums
        run: |
          cp docs/android5-compat-test.md "$ANDROID5_TEST_OUTPUT/TESTING.md"
          cd "$ANDROID5_TEST_OUTPUT"
          sha256sum *.apk > SHA256SUMS.txt
          cat apk-verification.json emulator-verification.json >> "$GITHUB_STEP_SUMMARY"
      - name: Publish private verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TEST_TAG" "$ANDROID5_TEST_OUTPUT"/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title 'Android 5 兼容性测试 · test.1' --notes-file docs/android5-compat-test.md
      - name: Publish same bytes to public test download
        env:
          GH_TOKEN: ${{ secrets.HONGGUO_RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh release create "$TEST_TAG" "$ANDROID5_TEST_OUTPUT"/* --repo aston314/hongguo-tv-releases --prerelease --latest=false --title 'Android 5 兼容性测试 · test.1' --notes-file docs/android5-compat-test.md
