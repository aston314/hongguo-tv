name: Linux AppImage test release

on:
  workflow_dispatch:
    inputs:
      publish_public:
        description: Publish the playback-verified Linux package (disable for branch validation)
        type: boolean
        default: true
        required: true
  push:
    branches: [codex/linux-appimage]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  desktop-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: desktop/go.sum
      - run: node frontend/build.mjs
      - name: Test production build on macOS
        if: runner.os == 'macOS'
        run: |
          export CGO_LDFLAGS="${CGO_LDFLAGS:-} -framework UniformTypeIdentifiers -mmacosx-version-min=10.13"
          go test -tags production ./...
      - name: Test production build on Windows
        if: runner.os == 'Windows'
        run: go test -tags production ./...

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Build in Debian 12 for an older Linux ABI baseline
        run: |
          mkdir -p "$RUNNER_TEMP/linux-appimage-candidate"
          linux_version="$(python3 -c 'import json; print(json.load(open("desktop/release.json"))["version_name"])')"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$linux_version"; fi
          docker run --rm -v "$PWD:/work" -v "$(go env GOROOT):/opt/go:ro" -v "$(go env GOMODCACHE):/go/pkg/mod" -v "$RUNNER_TEMP/linux-appimage-candidate:/out" \
            -e GITHUB_ACTIONS=true -e GITHUB_SHA="$GITHUB_SHA" -e HONGGUO_CORE_VERSION="$linux_version-$GITHUB_SHA" \
            -e HONGGUO_LINUX_VERSION="$linux_version" -e HONGGUO_LINUX_OUT=/out -w /work debian:12 bash -c '
              set -e
              apt-get update -qq
              apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev ca-certificates curl file desktop-file-utils squashfs-tools
              export PATH="/opt/go/bin:$PATH" GOROOT=/opt/go GOPATH=/go
              bash scripts/build_linux_appimage.sh
            '
      - name: Internal candidate transfer (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: internal-linux-appimage-candidate
          path: ${{ runner.temp }}/linux-appimage-candidate/*
          retention-days: 1
          if-no-files-found: error

  playback:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            label: ubuntu-24.04
          - image: debian:12
            label: debian-12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: internal-linux-appimage-candidate
          path: ${{ runner.temp }}/linux-appimage-candidate
      - name: Verify same AppImage with real video on target distribution
        run: |
          mkdir -p "$RUNNER_TEMP/linux-appimage-evidence"
          docker run --rm --shm-size=1g --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$PWD:/work:ro" -v "$RUNNER_TEMP/linux-appimage-candidate:/candidate" -v "$RUNNER_TEMP/linux-appimage-evidence:/evidence" \
            -e HONGGUO_PROBE_OUTPUT=/evidence -w /candidate '${{ matrix.image }}' bash -c '
              set -e
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates libwebkit2gtk-4.1-0 gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio gstreamer1.0-tools bubblewrap xdg-dbus-proxy xvfb xauth dbus-x11 pulseaudio pulseaudio-utils ffmpeg imagemagick python3-pil fonts-noto-cjk openbox xdotool
              useradd -m -u 1100 probe
              chown -R probe:probe /evidence /candidate
              set +e
              runuser -u probe -- bash /work/scripts/test_linux_appimage.sh
              probe_status=$?
              set -e
              chmod -R a+rX /evidence
              exit "$probe_status"
            '
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-evidence-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/linux-appimage-evidence/*.json
            ${{ runner.temp }}/linux-appimage-evidence/*.png
            ${{ runner.temp }}/linux-appimage-evidence/*.txt
          retention-days: 5
          if-no-files-found: warn

  publish-linux:
    needs: [desktop-compatibility, playback]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_public)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release source line
        run: python3 scripts/verify_release_source.py --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
      - name: Read Linux release version
        run: python3 scripts/desktop_metadata.py --github-env "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: internal-linux-appimage-candidate
          path: ${{ runner.temp }}/linux-appimage-release
      - name: Publish playback-verified Linux test package
        env:
          GH_TOKEN: ${{ secrets.HONGGUO_RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Configure HONGGUO_RELEASES_TOKEN" >&2; exit 1; }
          python3 scripts/publish_linux_appimage.py \
            --directory "$RUNNER_TEMP/linux-appimage-release" \
            --version "$APP_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --notes docs/linux-appimage-release.md
