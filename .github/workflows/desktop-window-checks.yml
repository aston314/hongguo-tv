name: Desktop window checks

on:
  push:
    branches: [main, codex/desktop-mini-titlebar]
    paths: ['desktop/**', 'core/cmd/hongguotv/ui/desktop*', 'tests/desktop*', '.github/workflows/desktop-window-checks.yml']
  pull_request:
    paths: ['desktop/**', 'core/cmd/hongguotv/ui/desktop*', 'tests/desktop*', '.github/workflows/desktop-window-checks.yml']

permissions:
  contents: read

jobs:
  window-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test shared desktop controls and localisation
        shell: bash
        run: |
          node --test tests/desktop*.test.cjs tests/i18n.test.cjs tests/cinema-navigation.test.cjs
          node desktop/frontend/build.mjs
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth
      - name: Test macOS native windows
        if: runner.os == 'macOS'
        working-directory: desktop
        run: go test -race -tags production ./...
        env:
          CGO_LDFLAGS: '-framework UniformTypeIdentifiers -mmacosx-version-min=10.13'
      - name: Test Windows native windows
        if: runner.os == 'Windows'
        working-directory: desktop
        run: go test -race -tags production ./...
      - name: Test Linux native windows
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a go test -race -tags production,webkit2_41 ./...
