name: Zidoo layout preview APK

on:
  push:
    branches:
      - codex/zidoo-base-media-query

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build shared Android core
        run: bash scripts/build_android_binaries.sh
        env:
          VERSION: zidoo-preview-${{ github.sha }}
      - name: Build standard debug APK
        run: gradle --no-daemon --max-workers=1 -p android assembleStandardDebug
      - name: Upload standard debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zidoo-layout-preview-${{ github.sha }}
          path: android/app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 3
