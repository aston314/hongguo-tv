name: Private MPV audio backend A-B

on:
  push:
    branches:
      - codex/mpv-audio-output-ab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpv-audio-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/codex/mpv-audio-output-ab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require expected repository and existing release signing
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test "$GITHUB_REPOSITORY" = aston314/hongguo-tv
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
      - name: Read version
        run: python3 scripts/release_metadata.py --github-env "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Check shared core and UI
        run: |
          go test ./...
          go test -race ./core/cmd/hongguotv -run 'Test(QR|Account|UpSMS|NewMFA|LateExpiry|TemporaryMFA)'
          python3 -m unittest discover -s tests -p "test_*.py"
          node --test tests/*.test.cjs
      - name: Build one shared Go core and stage the pinned MPV libraries
        env:
          VERSION: ${{ env.HONGGUO_CORE_VERSION }}
        run: |
          bash scripts/build_android_binaries.sh
          python3 scripts/prepare_mpv.py
          mkdir -p "$RUNNER_TEMP/mpv-audio-ab"
          python3 scripts/package_mpv_sources.py --out "$RUNNER_TEMP/mpv-audio-ab/hongguo-tv-mpv-library-source-$APP_VERSION.zip"
      - name: Restore existing signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/mpv-audio-ab.keystore"
          chmod 600 "$RUNNER_TEMP/mpv-audio-ab.keystore"
      - name: Build signed baseline and AudioTrack comparison
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/mpv-audio-ab.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          HONGGUO_MPV_AUDIO_OUTPUT=opensles,audiotrack gradle --no-daemon --max-workers=1 -p android testMpvReleaseUnitTest assembleMpvRelease lintMpvRelease
          cp android/app/build/outputs/apk/mpv/release/app-mpv-release.apk "$RUNNER_TEMP/mpv-audio-ab/hongguo-tv-mpv-audio-opensles.apk"
          HONGGUO_MPV_AUDIO_OUTPUT=audiotrack,opensles gradle --no-daemon --max-workers=1 -p android testMpvReleaseUnitTest assembleMpvRelease lintMpvRelease
          cp android/app/build/outputs/apk/mpv/release/app-mpv-release.apk "$RUNNER_TEMP/mpv-audio-ab/hongguo-tv-mpv-audio-audiotrack.apk"
      - name: Verify signatures, backend constants and identical media/core payloads
        run: |
          python3 scripts/verify_mpv_audio_ab.py --directory "$RUNNER_TEMP/mpv-audio-ab" --version "$APP_VERSION" --code "$MPV_VERSION_CODE" --commit "$GITHUB_SHA"
          cd "$RUNNER_TEMP/mpv-audio-ab"
          sha256sum *.apk *.zip MANIFEST.json > SHA256SUMS.txt
          cat MANIFEST.json >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mpv-audio-ab.keystore"
      - name: Stage private draft download for this device test only
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TAG: mpv-audio-ab-${{ github.run_id }}
        run: |
          gh release create "$RUN_TAG" "$RUNNER_TEMP/mpv-audio-ab/"* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "Private MPV audio backend comparison" \
            --notes "Temporary maintainer device test. Same source, core, media libraries, package, version and release certificate; only MPV audio backend preference differs. No public mirror or update manifests. Delete this private draft after downloading the verified files."
          test "$(gh release view "$RUN_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
