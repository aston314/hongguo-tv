name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read APK version
        run: python3 scripts/release_metadata.py --github-env "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.mod
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test Go core
        run: go test ./...
      - name: Check TV JavaScript and pagination
        run: |
          node --check core/cmd/hongguotv/ui/app.js
          node --check core/cmd/hongguotv/ui/native-player.js
          node --check core/cmd/hongguotv/ui/playback-diagnostics.js
          node --check core/cmd/hongguotv/ui/playback-settings.js
          node --check core/cmd/hongguotv/ui/sidebar-settings.js
          node --check core/cmd/hongguotv/ui/auto-cinema.js
          node --check core/cmd/hongguotv/ui/compat.js
          node --check core/cmd/hongguotv/ui/episode-prefetch.js
          node --check core/cmd/hongguotv/ui/playback-recovery.js
          node --check core/cmd/hongguotv/ui/end-recommendations.js
          node --check core/cmd/hongguotv/ui/updates.js
          node --check core/cmd/hongguotv/ui/engagement.js
          node --check core/cmd/hongguotv/ui/sms-verification.js
          node --check core/cmd/hongguotv/ui/numeric-keypad.js
          node --check core/cmd/hongguotv/ui/number-input.js
          node --check core/cmd/hongguotv/ui/search-history.js
          node --check core/cmd/hongguotv/ui/recommendation-direction.js
          python3 -m unittest discover -s tests -p "test_*.py"
          node --test tests/*.test.cjs
      - name: Verify webOS service bootstrap, media routing and staged app
        run: bash scripts/verify_webos.sh
      - name: Build Android native binaries
        run: bash scripts/build_android_binaries.sh
        env:
          VERSION: ${{ env.HONGGUO_CORE_VERSION }}
      - name: Prepare LGPL MPV libraries and source kit
        run: |
          python3 scripts/prepare_mpv.py
          python3 scripts/package_mpv_sources.py --out "$RUNNER_TEMP/hongguo-tv-mpv-library-source-$APP_VERSION.zip"
      # Keep flavor packaging in separate Gradle invocations; AGP's native
      # library splitter can race when both APK variants package together.
      - name: Build and lint standard debug APK
        run: gradle --no-daemon --max-workers=1 -p android testStandardDebugUnitTest assembleStandardDebug lintStandardDebug
      - name: Build and lint MPV debug APK
        run: gradle --no-daemon --max-workers=1 -p android testMpvDebugUnitTest assembleMpvDebug lintMpvDebug
      - name: Verify debug edition isolation
        run: python3 scripts/verify_apks.py --standard android/app/build/outputs/apk/standard/debug/app-standard-debug.apk --mpv android/app/build/outputs/apk/mpv/debug/app-mpv-debug.apk --version "$APP_VERSION" --standard-code "$APP_VERSION_CODE" --mpv-code "$MPV_VERSION_CODE" --debug
      - name: Upload MPV channel playback diagnostic APK
        if: github.ref == 'refs/heads/codex/mpv-channel-first-play-diagnostics'
        uses: actions/upload-artifact@v4
        with:
          name: mpv-channel-first-play-diagnostics
          path: android/app/build/outputs/apk/mpv/debug/app-mpv-debug.apk
          if-no-files-found: error
          retention-days: 14
