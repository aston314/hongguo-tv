name: webOS experimental package

on:
  workflow_dispatch:
    inputs:
      publish_update:
        description: Publish the webOS update notice after the IPK release
        required: false
        default: false
        type: boolean
  push:
    branches:
      - codex/webos-experimental
    tags:
      - 'v*'
    paths:
      - 'webos/**'
      - 'scripts/build_webos.sh'
      - 'scripts/verify_webos.sh'
      - 'core/cmd/hongguotv/ui/**'
      - 'desktop/resources/appicon.png'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release source line
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/verify_release_source.py --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --sha "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install webOS CLI
        run: npm install --global --ignore-scripts @webos-tools/cli
      - name: Verify webOS source
        run: ./scripts/verify_webos.sh
      - name: Package experimental ipk
        run: ./scripts/build_webos.sh
      - name: Verify packaged app and service entry points
        run: python3 scripts/verify_webos_ipk.py "$(find dist/webos -maxdepth 1 -type f -name '*.ipk' -print -quit)"
      - name: Prepare test release assets
        id: release
        run: |
          version=$(node -p "require('./webos/appinfo.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          tag="webos-v${version}-test.27"
          ipk=$(find dist/webos -maxdepth 1 -type f -name '*.ipk' -print -quit)
          test -n "$ipk"
          asset="dist/webos/hongguo-webos-${version}-test.27.ipk"
          mv "$ipk" "$asset"
          (cd dist/webos && sha256sum "$(basename "$asset")" > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Publish webOS test release to public downloads
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HONGGUO_RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Missing HONGGUO_RELEASES_TOKEN" >&2; exit 1; }
          if ! gh release view "${{ steps.release.outputs.tag }}" --repo aston314/hongguo-tv-releases >/dev/null 2>&1; then
            gh release create "${{ steps.release.outputs.tag }}" \
              "${{ steps.release.outputs.asset }}" \
              "dist/webos/SHA256SUMS.txt" \
              --repo aston314/hongguo-tv-releases \
              --title "红果短剧 webOS 测试版 ${{ steps.release.outputs.version }}" \
              --prerelease \
              --notes-file docs/webos-release.md
          fi
          if [[ "$GITHUB_EVENT_NAME" == push || "${{ inputs.publish_update }}" == true ]]; then
            python3 scripts/publish_webos_update.py \
              --ipk "${{ steps.release.outputs.asset }}" \
              --version "${{ steps.release.outputs.version }}" \
              --notes docs/webos-release.md \
              --out "$RUNNER_TEMP/webos-update.json" --publish
          else
            echo "Manual test package: leaving webOS update notice unchanged"
          fi
