name: Core browser preview

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Host platform for the local browser preview
        type: choice
        options: [darwin-arm64, darwin-amd64, linux-amd64, windows-amd64]
        default: darwin-arm64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum
      - name: Test the Go core
        run: go test ./...
      - name: Build the requested preview core
        env:
          PREVIEW_PLATFORM: ${{ inputs.platform }}
          CGO_ENABLED: "0"
        run: |
          export GOOS="${PREVIEW_PLATFORM%-*}"
          export GOARCH="${PREVIEW_PLATFORM#*-}"
          mkdir -p preview
          output=preview/hongguo-tv-core
          if [ "$GOOS" = windows ]; then output="$output.exe"; fi
          go build -trimpath -ldflags "-X main.version=preview-${GITHUB_SHA}" -o "$output" ./core/cmd/hongguotv
          sha256sum "$output" > preview/SHA256SUMS.txt
          git rev-parse HEAD > preview/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: core-preview-${{ inputs.platform }}
          path: preview/
          retention-days: 3
