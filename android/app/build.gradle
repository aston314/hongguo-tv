plugins {
    id "com.android.application"
}

def appVersion = "0.2.146"
def mpvVersionCode = 97
def coreVersion = System.getenv("HONGGUO_CORE_VERSION") ?: "${appVersion}-dev"
def signingVariables = ["ANDROID_KEYSTORE_FILE", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
def releaseSigningReady = signingVariables.every { System.getenv(it) }

android {
    namespace "rocks.aston.hongguotv"
    compileSdk 36

    flavorDimensions "player"

    defaultConfig {
        applicationId "rocks.aston.hongguotv"
        minSdk 23
        targetSdk 35
        versionCode 145
        versionName appVersion
        buildConfigField "String", "CORE_VERSION", "\"${coreVersion}\""
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    productFlavors {
        standard {
            dimension "player"
            resValue "string", "app_name", "红果短剧"
            buildConfigField "String", "VARIANT_ID", '"standard"'
            buildConfigField "String", "PLAYER_ENGINE", '"webview_media3"'
        }
        mpv {
            dimension "player"
            applicationIdSuffix ".mpv"
            minSdk 23
            versionCode mpvVersionCode
            resValue "string", "app_name", "红果短剧"
            buildConfigField "String", "VARIANT_ID", '"mpv"'
            buildConfigField "String", "PLAYER_ENGINE", '"mpv"'
        }
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "红果短剧"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Never upload an unsigned APK when release credentials are missing.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.startsWith("validateSigning") && it.name.endsWith("Release") } && !releaseSigningReady) {
        throw new GradleException("Release signing requires all four Android signing environment variables")
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.tvprovider:tvprovider:1.0.0"
    // Keep standard's v0.2.136 Media3 fallback independent of the MPV flavor.
    standardImplementation "androidx.media3:media3-exoplayer:1.8.0"
    standardImplementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    mpvImplementation "androidx.media3:media3-exoplayer:1.11.1"
    mpvImplementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    // LGPL native libraries remain isolated to src/mpv/jniLibs.
    // Standard uses platform decoders and does not bundle NextLib/FFmpeg.
    testImplementation "junit:junit:4.13.2"
}

// Check resolved artifacts, not just declared versions: a transitive dependency
// must never silently upgrade standard or add back a software renderer.
tasks.register("verifyPlayerDependencyIsolation") {
    doLast {
        [standard: "1.8.0", mpv: "1.11.1"].each { flavor, version ->
            ["Debug", "Release"].each { buildType ->
                def modules = configurations.getByName("${flavor}${buildType}RuntimeClasspath")
                        .resolvedConfiguration.resolvedArtifacts.collect { it.moduleVersion.id }
                def media = modules.findAll { it.group == "androidx.media3" }
                if (!media.any { it.name == "media3-exoplayer" } ||
                        !media.any { it.name == "media3-exoplayer-hls" } ||
                        media.any { it.version != version }) {
                    throw new GradleException("Unexpected ${flavor}${buildType} Media3 dependencies: ${media}")
                }
                if (modules.any { it.group.contains("nextlib") || it.name.contains("ffmpeg") || it.name.contains("media3ext") }) {
                    throw new GradleException("Unexpected bundled FFmpeg dependency in ${flavor}${buildType}")
                }
                println("Verified ${flavor}${buildType}: Media3 ${version}, no NextLib/FFmpeg extensions")
            }
        }
    }
}
