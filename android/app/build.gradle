plugins {
    id "com.android.application"
}

def appVersion = "0.2.136"
// Experimental branch only: normal CI still exercises the production defaults.
def android5Compat = providers.gradleProperty("android5Compat").orNull == "true"
def android5Arm32Only = providers.gradleProperty("android5Arm32Only").orNull == "true"
if (android5Arm32Only && !android5Compat) throw new GradleException("ARM32 test packaging requires android5Compat")
def mpvVersionCode = 87
def coreVersion = System.getenv("HONGGUO_CORE_VERSION") ?: "${appVersion}-dev"
def signingVariables = ["ANDROID_KEYSTORE_FILE", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
def releaseSigningReady = signingVariables.every { System.getenv(it) }

android {
    namespace "rocks.aston.hongguotv"
    compileSdk 35

    flavorDimensions "player"

    defaultConfig {
        applicationId "rocks.aston.hongguotv"
        minSdk android5Compat ? 21 : 23
        targetSdk 35
        versionCode 135
        versionName appVersion
        buildConfigField "String", "CORE_VERSION", "\"${coreVersion}\""
        buildConfigField "boolean", "ANDROID5_COMPAT_TEST", android5Compat.toString()
        manifestPlaceholders = [bootReceiverEnabled: !android5Compat,
                                deepLinkScheme: android5Compat ? "hongguo-android5-test" : "hongguo"]
        ndk {
            if (android5Arm32Only) abiFilters "armeabi-v7a"
            else abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    productFlavors {
        standard {
            dimension "player"
            if (android5Compat) {
                applicationIdSuffix ".android5test"
                versionCode 1
                versionName "${appVersion}-android5-test.1"
            }
            resValue "string", "app_name", android5Compat ? "红果短剧 · Android 5 测试" : "红果短剧"
            buildConfigField "String", "VARIANT_ID", '"standard"'
            buildConfigField "String", "PLAYER_ENGINE", '"webview_media3"'
        }
        mpv {
            dimension "player"
            applicationIdSuffix ".mpv"
            minSdk 23
            versionCode mpvVersionCode
            resValue "string", "app_name", "红果短剧"
            buildConfigField "String", "VARIANT_ID", '"mpv"'
            buildConfigField "String", "PLAYER_ENGINE", '"mpv"'
        }
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "红果短剧"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Never upload an unsigned APK when release credentials are missing.
gradle.taskGraph.whenReady { graph ->
    if (android5Compat && graph.allTasks.any { it.name.toLowerCase().contains("mpv") }) {
        throw new GradleException("Android 5 experiment supports the standard player only")
    }
    if (graph.allTasks.any { it.name.startsWith("validateSigning") && it.name.endsWith("Release") } && !releaseSigningReady) {
        throw new GradleException("Release signing requires all four Android signing environment variables")
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.tvprovider:tvprovider:1.0.0"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    // LGPL native libraries are staged only in src/mpv/jniLibs by prepare_mpv.py.
    // No MPV AAR or transitive GPL binary is included in the standard flavor.
    testImplementation "junit:junit:4.13.2"
}
