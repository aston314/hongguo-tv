plugins {
    id "com.android.application"
}

def appVersion = "0.2.136"
def mpvVersionCode = 87
def coreVersion = System.getenv("HONGGUO_CORE_VERSION") ?: "${appVersion}-dev"
def signingVariables = ["ANDROID_KEYSTORE_FILE", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
def releaseSigningReady = signingVariables.every { System.getenv(it) }

android {
    namespace "rocks.aston.hongguotv"
    compileSdk 36

    flavorDimensions "player"

    defaultConfig {
        applicationId "rocks.aston.hongguotv"
        minSdk 23
        targetSdk 35
        versionCode 135
        versionName appVersion
        buildConfigField "String", "CORE_VERSION", "\"${coreVersion}\""
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    productFlavors {
        standard {
            dimension "player"
            resValue "string", "app_name", "红果短剧"
            buildConfigField "String", "VARIANT_ID", '"standard"'
            buildConfigField "String", "PLAYER_ENGINE", '"media3"'
        }
        mpv {
            dimension "player"
            applicationIdSuffix ".mpv"
            minSdk 23
            versionCode mpvVersionCode
            resValue "string", "app_name", "红果短剧"
            buildConfigField "String", "VARIANT_ID", '"mpv"'
            buildConfigField "String", "PLAYER_ENGINE", '"mpv"'
        }
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "红果短剧"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Never upload an unsigned APK when release credentials are missing.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.startsWith("validateSigning") && it.name.endsWith("Release") } && !releaseSigningReady) {
        throw new GradleException("Release signing requires all four Android signing environment variables")
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.tvprovider:tvprovider:1.0.0"
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.11.1"
    standardImplementation "io.github.anilbeesetti:nextlib-media3ext:1.11.1-0.17.0"
    // LGPL MPV libraries stay isolated to MPV. Standard Media3 includes
    // NextLib's GPL-3.0 FFmpeg renderer for bounded software fallback.
    testImplementation "junit:junit:4.13.2"
}
