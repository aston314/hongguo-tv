plugins { id "com.android.application" }

android {
    namespace "rocks.aston.hongguoresolverjsdiag"
    compileSdk 36
    defaultConfig {
        applicationId "rocks.aston.hongguoresolverjsdiag"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}
